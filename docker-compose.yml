services:
  db:
    image: mysql:8.0
    container_name: hair_salon_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hair_salon_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password --max_connections=200
    cpus: 8
    mem_limit: "512m"

  app:
    build: .
    container_name: hair_salon_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hair_salon_db
      DB_POOL_SIZE: 30
    ports:
      - "8000:8000"

volumes:
  mysql_data: